<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMS Hub — 1.000 clientes, cero visibilidad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gems:#8b5cf6;--gems2:#a78bfa;--red:#ff5470}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
  html,body{background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}

  .stage{
    position:relative;width:96vmin;height:96vmin;
    background:radial-gradient(120% 100% at 72% 18%,#100c28 0%,#04050f 58%);
    overflow:hidden;box-shadow:0 40px 140px rgba(0,0,0,.8);
  }
  .grain{position:absolute;inset:0;opacity:.5;z-index:1;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);
    background-size:36px 36px}

  /* ── clúster de gemas facetadas = base de clientes ── */
  .cluster{position:absolute;inset:0;z-index:2}
  .gem{
    position:absolute;opacity:0;transform:scale(.5) rotate(var(--r,0deg));
    animation:gemIn .7s cubic-bezier(.2,1.3,.3,1) forwards;
    filter:drop-shadow(0 6px 18px rgba(139,92,246,.45));
  }
  @keyframes gemIn{to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
  .gem svg{width:100%;height:100%;display:block}

  /* gemas que se desprenden — rotas, en rojo, cayendo al vacío */
  .shard{
    position:absolute;opacity:0;transform:scale(.4) rotate(var(--r,0deg));
    animation:shardIn 1s cubic-bezier(.2,1.4,.3,1) forwards;
    filter:drop-shadow(0 4px 14px rgba(255,84,112,.5));
  }
  @keyframes shardIn{to{opacity:.92;transform:scale(1) rotate(var(--r,0deg))}}

  /* línea de fractura entre el clúster sólido y los fragmentos sueltos */
  .fissure{position:absolute;z-index:3;opacity:.55;pointer-events:none}

  .copy{position:absolute;left:7%;bottom:8%;right:7%;z-index:10}
  .kicker{display:flex;align-items:center;gap:0.9vmin;font-size:1.5vmin;font-weight:800;letter-spacing:.28em;color:var(--gems2);text-transform:uppercase;margin-bottom:1.8vmin}
  .kicker img{width:2.8vmin;height:2.8vmin;object-fit:contain;filter:drop-shadow(0 0 6px rgba(139,92,246,.65))}
  .headline{font-size:7.4vmin;font-weight:900;line-height:1.02;letter-spacing:-.02em;color:#fff}
  .headline .hl{background:linear-gradient(120deg,var(--gems),var(--gems2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .headline .red{color:var(--red)}
  .sub{margin-top:2.2vmin;font-size:2.5vmin;font-weight:500;color:#9aa0b0;max-width:80%;line-height:1.4}
  .cta{
    display:inline-flex;align-items:center;gap:1vmin;margin-top:3.2vmin;
    padding:1.6vmin 3vmin;border-radius:100px;font-size:2vmin;font-weight:800;color:#fff;
    background:linear-gradient(120deg,var(--gems),var(--gems2));
    box-shadow:0 10px 34px rgba(139,92,246,.5);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="cluster" id="cluster"></div>

  <svg class="fissure" viewBox="0 0 100 100" preserveAspectRatio="none" style="left:62%;top:8%;width:36%;height:58%">
    <path d="M20 0 C 30 18, 55 28, 48 46 S 70 62, 80 100" fill="none" stroke="#ff5470" stroke-width="0.5" stroke-dasharray="1.5 2.5"/>
  </svg>

  <div class="copy">
    <div class="kicker"><img src="public/gems-logo.png" alt="">Gems Hub</div>
    <div class="headline">1.000 clientes.<br><span class="red">Cero</span> <span class="hl">visibilidad.</span></div>
    <div class="sub">Vender más no resuelve nada si por dentro nadie sabe qué está pasando.</div>
    <div class="cta">Empieza gratis →</div>
  </div>
</div>

<script>
// Gema facetada — un polígono de "caras" con distinto brillo, no un círculo con blur.
function gemSVG(id, light, mid, dark){
  return `<svg viewBox="0 0 100 100"><defs>
    <linearGradient id="g${id}a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${light}"/><stop offset="100%" stop-color="${mid}"/>
    </linearGradient>
    <linearGradient id="g${id}b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${mid}"/><stop offset="100%" stop-color="${dark}"/>
    </linearGradient>
  </defs>
  <polygon points="50,2 88,32 74,90 26,90 12,32" fill="url(#g${id}a)"/>
  <polygon points="50,2 88,32 50,46" fill="${light}" opacity=".55"/>
  <polygon points="50,46 88,32 74,90" fill="url(#g${id}b)"/>
  <polygon points="50,46 26,90 12,32" fill="${dark}" opacity=".75"/>
  <polygon points="50,2 50,46 12,32" fill="${mid}" opacity=".4"/>
  </svg>`;
}

const cluster = document.getElementById('cluster');
const cx = 66, cy = 32; // % — centro del clúster (arriba-derecha)

const sizes = [
  {n:5, s:[9,13], spread:7},
  {n:9, s:[5,8],  spread:14},
  {n:14,s:[2.6,4.6], spread:21},
];
let gi=0;
sizes.forEach(L=>{
  for(let i=0;i<L.n;i++){
    const d=document.createElement('div');
    d.className='gem';
    const ang=Math.random()*Math.PI*2, dist=Math.random()*L.spread;
    const size=L.s[0]+Math.random()*(L.s[1]-L.s[0]);
    d.style.width=size+'vmin';d.style.height=size+'vmin';
    d.style.left=(cx+Math.cos(ang)*dist)+'%';
    d.style.top=(cy+Math.sin(ang)*dist*.72)+'%';
    d.style.setProperty('--r',(Math.random()*40-20)+'deg');
    d.style.animationDelay=(gi*0.025)+'s'; gi++;
    d.innerHTML=gemSVG('c'+gi,'#e9d8fd','#8b5cf6','#4c1d95');
    cluster.appendChild(d);
  }
});

// Fragmentos rojos que se desprenden — cascada hacia abajo-derecha, lejos
// del bloque de texto (que vive abajo-izquierda, top:53%-92% aprox).
const strays = [
  [78,44,4.2],[86,50,3],[92,42,3.6],[82,58,2.6],[94,56,3.2],
  [88,66,2.2],[76,64,3],[91,74,2.4]
];
strays.forEach(([x,y,s],i)=>{
  const d=document.createElement('div');
  d.className='shard';
  d.style.width=s+'vmin';d.style.height=s+'vmin';
  d.style.left=x+'%';d.style.top=y+'%';
  d.style.setProperty('--r',(Math.random()*60-30)+'deg');
  d.style.animationDelay=(0.5+i*0.09)+'s';
  d.innerHTML=gemSVG('s'+i,'#ffb3bf','#ff5470','#7f1d2b');
  cluster.appendChild(d);
});
</script>
</body>
</html>
