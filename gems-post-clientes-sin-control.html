<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMS Hub — 1.000 clientes, cero visibilidad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gems:#8b5cf6;--gems2:#a78bfa;--red:#ff5470}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
  html,body{background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}

  .stage{
    position:relative;width:96vmin;height:96vmin;
    background:radial-gradient(120% 100% at 70% 15%,#0e0b24 0%,#04050f 60%);
    overflow:hidden;box-shadow:0 40px 140px rgba(0,0,0,.8);
    perspective:1000px;
  }

  /* grain */
  .grain{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);
    background-size:36px 36px;z-index:1}

  /* ghost number behind everything */
  .ghost{
    position:absolute;right:-4%;top:6%;font-size:46vmin;font-weight:900;
    color:transparent;-webkit-text-stroke:1.5px rgba(139,92,246,.14);
    letter-spacing:-.04em;z-index:0;line-height:1;user-select:none;
  }

  /* dot cluster = client swarm, layered by depth */
  .cluster{position:absolute;inset:0;z-index:2;transform-style:preserve-3d}
  .dot{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#c4b5fd,var(--gems) 60%,#5b21b6 100%);
    box-shadow:0 0 18px rgba(139,92,246,.55);
  }
  .dot.far{filter:blur(1.5px);opacity:.55}
  .dot.mid{filter:blur(.3px);opacity:.85}
  .dot.near{box-shadow:0 0 26px rgba(167,139,250,.75)}

  /* broken-away dots: chaos, unmanaged clients */
  .stray{
    position:absolute;border-radius:50%;background:var(--red);
    box-shadow:0 0 14px rgba(255,84,112,.6);opacity:0;
    transform:scale(.4);
    animation:strayIn 1.1s cubic-bezier(.2,1.4,.3,1) forwards;
  }
  @keyframes strayIn{to{opacity:.9;transform:scale(1)}}

  .crack{position:absolute;z-index:3;opacity:.6}

  /* text block */
  .copy{position:absolute;left:7%;bottom:8%;right:7%;z-index:10}
  .kicker{font-size:1.5vmin;font-weight:800;letter-spacing:.28em;color:var(--gems2);text-transform:uppercase;margin-bottom:1.6vmin}
  .kicker::before{content:'';display:inline-block;width:1.4vmin;height:1.4vmin;background:var(--gems);border-radius:50%;margin-right:1vmin;vertical-align:middle;box-shadow:0 0 10px var(--gems)}
  .headline{font-size:7.4vmin;font-weight:900;line-height:1.02;letter-spacing:-.02em;color:#fff}
  .headline .hl{background:linear-gradient(120deg,var(--gems),var(--gems2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .headline .red{color:var(--red)}
  .sub{margin-top:2.2vmin;font-size:2.5vmin;font-weight:500;color:#9aa0b0;max-width:80%;line-height:1.4}
  .cta{
    display:inline-flex;align-items:center;gap:1vmin;margin-top:3.2vmin;
    padding:1.6vmin 3vmin;border-radius:100px;font-size:2vmin;font-weight:800;color:#fff;
    background:linear-gradient(120deg,var(--gems),var(--gems2));
    box-shadow:0 10px 34px rgba(139,92,246,.5);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="ghost">1.000</div>

  <div class="cluster" id="cluster"></div>

  <div class="copy">
    <div class="kicker">Gems Hub</div>
    <div class="headline">1.000 clientes.<br><span class="red">Cero</span> <span class="hl">visibilidad.</span></div>
    <div class="sub">Vender más no resuelve nada si por dentro nadie sabe qué está pasando.</div>
    <div class="cta">Empieza gratis →</div>
  </div>
</div>

<script>
const cluster = document.getElementById('cluster');
const cx = 68, cy = 34; // % — centro del enjambre (arriba-derecha)

// Enjambre denso = base de clientes creciendo, capas por profundidad
const layers = [
  {n: 10, r: [2.6,4.2], spread: 9,  cls:'near'},
  {n: 16, r: [1.6,2.8], spread: 15, cls:'mid'},
  {n: 22, r: [0.8,1.8], spread: 22, cls:'far'},
];
layers.forEach(L=>{
  for(let i=0;i<L.n;i++){
    const d=document.createElement('div');
    d.className='dot '+L.cls;
    const ang=Math.random()*Math.PI*2, dist=Math.random()*L.spread;
    const size=L.r[0]+Math.random()*(L.r[1]-L.r[0]);
    d.style.width=size+'vmin';d.style.height=size+'vmin';
    d.style.left=(cx+Math.cos(ang)*dist)+'%';
    d.style.top=(cy+Math.sin(ang)*dist*.7)+'%';
    cluster.appendChild(d);
  }
});

// Puntos que se desprenden del enjambre — caos, sin control.
// Cascada hacia abajo-derecha, lejos del bloque de texto (que vive abajo-izq).
const strays = [
  [78,52],[86,58],[91,50],[82,66],[94,64],[88,74],[76,72],[92,80]
];
strays.forEach(([x,y],i)=>{
  const s=document.createElement('div');
  s.className='stray';
  const size=1+Math.random()*1.6;
  s.style.width=size+'vmin';s.style.height=size+'vmin';
  s.style.left=x+'%';s.style.top=y+'%';
  s.style.animationDelay=(i*0.09)+'s';
  cluster.appendChild(s);
});
</script>
</body>
</html>
