<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GEMS Hub — Cupos Limitados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Inter', sans-serif; }
  .post {
    width: 1080px;
    height: 1080px;
    background: #0d0e1a;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 72px 76px;
  }
  .post::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 40% at 82% 6%, rgba(251,113,133,0.16) 0%, transparent 65%),
      radial-gradient(ellipse 65% 55% at 50% 40%, rgba(124,58,237,0.26) 0%, transparent 70%);
    pointer-events: none;
  }
  .post-mantis {
    position: absolute;
    top: 50%; right: -140px;
    transform: translateY(-50%);
    width: 780px; height: 780px;
    background-image: url('/marketing/mantis-assets/mantis-cabeza.png');
    background-size: cover;
    background-position: center;
    opacity: 0.1;
    filter: saturate(1.3);
    mask-image: radial-gradient(circle, black 35%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle, black 35%, transparent 72%);
    pointer-events: none;
  }

  .brand { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 10px 22px 10px 10px; align-self: flex-start; }
  .brand-dot { width: 40px; height: 40px; }
  .brand-dot img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; }
  .brand-name { color: #fff; font-weight: 800; font-size: 19px; letter-spacing: -0.1px; }

  .stage { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; position: relative; z-index: 1; }

  .eyebrow { display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18); color: #e9e3ff; font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 9px 18px; border-radius: 999px; margin-bottom: 28px; }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }

  .headline { color: #fff; font-size: 68px; font-weight: 900; line-height: 1.08; letter-spacing: -2px; margin-bottom: 24px; }
  .headline .accent { color: #a78bfa; }

  .sub { color: rgba(255,255,255,0.55); font-size: 22px; line-height: 1.6; max-width: 640px; margin-bottom: 44px; }
  .sub b { color: rgba(255,255,255,0.85); font-weight: 700; }

  .counter { display: flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(124,58,237,0.3); border-radius: 20px;
    padding: 20px 28px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .counter-num { font-size: 46px; font-weight: 900; color: #fff; letter-spacing: -1px; line-height: 1; }
  .counter-num span { color: #a78bfa; }
  .counter-label { color: rgba(255,255,255,0.45); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.4; }

  .footer { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; margin-top: 48px; }
  .footer-cta { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #4c1d95; font-size: 19px; font-weight: 800; padding: 16px 30px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 10px; }
  .footer-note { color: rgba(255,255,255,0.4); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>

  <div class="post">
    <div class="post-mantis"></div>
    <div class="brand">
      <div class="brand-dot"><img src="/marketing/gems-icon.png" alt=""></div>
      <div class="brand-name">GEMS HUB</div>
    </div>

    <div class="stage">
      <div class="eyebrow"><span class="dot"></span> Abierto por tiempo limitado</div>
      <div class="headline">Buscamos<br><span class="accent">2-3 negocios.</span></div>
      <div class="sub">Para ser de los <b>primeros</b> en usar GEMS Hub — la plataforma para dejar de gestionar clientes y tareas por WhatsApp.</div>
      <div class="counter">
        <div class="counter-num"><span>2</span>/3</div>
        <div class="counter-label">Cupos disponibles<br>este mes</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-cta"><i class="fas fa-comment-dots"></i> Escríbeme al interno</div>
      <div class="footer-note">Sin compromiso, solo para conocer tu caso</div>
    </div>
  </div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
