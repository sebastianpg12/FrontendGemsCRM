<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GEMS Hub — Post Sencillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Inter', sans-serif; }
  .post {
    width: 1080px;
    height: 1350px;
    background: #0d0e1a;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 56px 64px;
  }
  .post::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 40% at 78% 8%, rgba(251,113,133,0.20) 0%, transparent 65%),
      radial-gradient(ellipse 60% 45% at 50% 42%, rgba(124,58,237,0.24) 0%, transparent 70%);
    pointer-events: none;
  }

  .handle { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .handle-dot { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; }
  .handle-dot img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; }
  .handle-name { color: #fff; font-weight: 800; font-size: 20px; letter-spacing: -0.2px; }

  .headline {
    margin-top: 64px;
    position: relative; z-index: 1;
    color: rgba(255,255,255,0.9);
    font-size: 40px;
    font-weight: 600;
    line-height: 1.35;
    max-width: 780px;
  }
  .headline b { font-weight: 800; color: #fff; }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  /* ── El "objeto" tipo calculadora: tablero con display ── */
  .device {
    width: 460px;
    background: linear-gradient(155deg, #8b5cf6 0%, #6d28d9 100%);
    border-radius: 48px;
    padding: 36px;
    box-shadow:
      0 50px 100px -20px rgba(76,29,149,0.6),
      inset 0 2px 0 rgba(255,255,255,0.25),
      inset 0 -8px 20px rgba(0,0,0,0.15);
    transform: rotate(-4deg);
  }
  .display {
    background: #1c1530;
    border-radius: 20px;
    padding: 28px 24px;
    margin-bottom: 24px;
    box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
  }
  .display-label { font-family: 'DM Mono', monospace; font-size: 13px; color: rgba(196,181,253,0.5); letter-spacing: 0.08em; margin-bottom: 8px; }
  .display-value { font-family: 'DM Mono', monospace; font-size: 44px; font-weight: 500; color: #fff; letter-spacing: 0.02em; }

  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .key {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.14);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), 0 4px 8px rgba(0,0,0,0.1);
  }
  .key i { color: rgba(255,255,255,0.85); font-size: 18px; }
  .key.accent {
    aspect-ratio: unset;
    height: 68px;
    background: rgba(255,255,255,0.95);
    gap: 10px;
  }
  .key.accent i { color: #7c3aed; font-size: 20px; }
  .key.accent span { color: #7c3aed; font-weight: 800; font-size: 17px; }

  .footer {
    position: relative; z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 40px;
  }
  .footer-cta { color: #fff; font-size: 26px; font-weight: 800; }
  .footer-contact { color: rgba(255,255,255,0.5); font-size: 20px; font-weight: 600; margin-top: 2px; }
</style>
</head>
<body>

  <div class="post">
    <div class="handle">
      <div class="handle-dot"><img src="/marketing/gems-icon.png" alt=""></div>
      <div class="handle-name">GEMS HUB</div>
    </div>

    <div class="headline">Según nuestros cálculos,<br>tu equipo necesita <b>orden.</b></div>

    <div class="stage">
      <div class="device">
        <div class="display">
          <div class="display-label">DIAGNÓSTICO</div>
          <div class="display-value">ORDEN</div>
        </div>
        <div class="keys">
          <div class="key"><i class="fas fa-users"></i></div>
          <div class="key"><i class="fas fa-list-check"></i></div>
          <div class="key"><i class="fas fa-ticket"></i></div>
          <div class="key"><i class="fas fa-comments"></i></div>
          <div class="key"><i class="fas fa-chart-bar"></i></div>
          <div class="key"><i class="fas fa-book"></i></div>
          <div class="key"><i class="fas fa-robot"></i></div>
          <div class="key"><i class="fas fa-folder"></i></div>
          <div class="key accent" style="grid-column: span 4;"><i class="fas fa-rocket"></i><span>GEMS HUB</span></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>
        <div class="footer-cta">Link en la bio</div>
        <div class="footer-contact">Empieza gratis hoy</div>
      </div>
    </div>
  </div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
