<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GEMS Hub — Carrusel 2/4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Inter', sans-serif; }
  .post {
    width: 1080px;
    height: 1350px;
    background: #0d0e1a;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 100px 88px;
  }
  .post::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 50% 40% at 85% 20%, rgba(124,58,237,0.18) 0%, transparent 65%);
    pointer-events: none;
  }
  .post-mantis {
    position: absolute;
    bottom: -200px; right: -180px;
    width: 760px; height: 760px;
    background-image: url('/marketing/mantis-assets/mantis-alas.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.09;
    filter: saturate(1.2);
    mask-image: radial-gradient(circle, black 32%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle, black 32%, transparent 70%);
    pointer-events: none;
  }

  .headline {
    position: relative; z-index: 1;
    color: #fff;
    font-size: 62px;
    font-weight: 900;
    line-height: 1.14;
    letter-spacing: -2px;
    margin-bottom: 56px;
  }
  .headline .accent { color: #a78bfa; }

  .pains { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 22px; }
  .pain { display: flex; align-items: flex-start; gap: 18px; }
  .pain-mark { color: #a78bfa; font-size: 30px; font-weight: 900; line-height: 1.4; flex-shrink: 0; }
  .pain-text { color: rgba(255,255,255,0.7); font-size: 30px; font-weight: 700; line-height: 1.4; }

  .sub-row {
    position: relative; z-index: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-top: 70px;
  }
  .arrow-btn {
    width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
  }
  .arrow-btn svg { width: 26px; height: 26px; stroke: #4c1d95; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

  <div class="post">
    <div class="post-mantis"></div>
    <div class="headline">Esto es lo que pasa cuando todo vive <span class="accent">en el chat.</span></div>

    <div class="pains">
      <div class="pain"><div class="pain-mark">—</div><div class="pain-text">Se te olvida un seguimiento</div></div>
      <div class="pain"><div class="pain-mark">—</div><div class="pain-text">Una tarea se pierde entre 200 mensajes</div></div>
      <div class="pain"><div class="pain-mark">—</div><div class="pain-text">Nadie sabe qué está pasando</div></div>
    </div>

    <div class="sub-row">
      <div class="arrow-btn"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </div>
  </div>

</body>
</html>
