<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GEMS Hub — Frase Contundente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Inter', sans-serif; }
  .post {
    width: 1080px;
    height: 1350px;
    background: #0d0e1a;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 100px 88px;
  }
  .post::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 50% 40% at 15% 20%, rgba(124,58,237,0.18) 0%, transparent 65%);
    pointer-events: none;
  }
  .post-mantis {
    position: absolute;
    top: -160px; right: -220px;
    width: 780px; height: 780px;
    background-image: url('/marketing/mantis-assets/mantis-perfil-contraluz.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.1;
    filter: saturate(1.2);
    mask-image: radial-gradient(circle, black 32%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle, black 32%, transparent 70%);
    pointer-events: none;
  }

  .headline {
    position: relative; z-index: 1;
    color: #fff;
    font-size: 84px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -3px;
  }
  .headline .accent { color: #a78bfa; }

  .sub-row {
    position: relative; z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 56px;
  }
  .sub {
    color: rgba(255,255,255,0.45);
    font-size: 24px;
    font-weight: 700;
    max-width: 640px;
  }
  .arrow-btn {
    width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
  }
  .arrow-btn svg { width: 26px; height: 26px; stroke: #4c1d95; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

  <div class="post">
    <div class="post-mantis"></div>
    <div class="headline">Tener WhatsApp<br><span class="accent">no es</span> tener un<br>sistema.</div>

    <div class="sub-row">
      <div class="sub">Cómo dejar de improvisar la gestión de tu equipo</div>
      <div class="arrow-btn"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </div>
  </div>

</body>
</html>
