<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GEMS Hub — Carrusel 4/4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Inter', sans-serif; }
  .post {
    width: 1080px;
    height: 1350px;
    background: #0d0e1a;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 100px 88px;
  }
  .post::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 50% 40% at 15% 80%, rgba(124,58,237,0.2) 0%, transparent 65%);
    pointer-events: none;
  }
  .post-mantis {
    position: absolute;
    top: -180px; right: -200px;
    width: 800px; height: 800px;
    background-image: url('/marketing/mantis-assets/mantis-cuerpo-diagonal.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.1;
    filter: saturate(1.2);
    mask-image: radial-gradient(circle, black 32%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle, black 32%, transparent 70%);
    pointer-events: none;
  }

  .headline {
    position: relative; z-index: 1;
    color: #fff;
    font-size: 80px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -3px;
    margin-bottom: 26px;
  }
  .headline .accent { color: #a78bfa; }

  .sub {
    position: relative; z-index: 1;
    color: rgba(255,255,255,0.45);
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 56px;
  }

  .cta {
    position: relative; z-index: 1;
    display: inline-flex; align-self: flex-start; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #4c1d95; font-size: 22px; font-weight: 800;
    padding: 20px 36px; border-radius: 999px;
  }
  .cta svg { width: 20px; height: 20px; stroke: #4c1d95; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

  <div class="post">
    <div class="post-mantis"></div>
    <div class="headline">Empieza<br><span class="accent">gratis hoy.</span></div>
    <div class="sub">Sin contratos largos. Sin curva de aprendizaje.</div>

    <div class="cta">Link en la bio <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
  </div>

</body>
</html>
