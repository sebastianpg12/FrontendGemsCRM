<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMS Hub — Tu equipo crece, la conexión no</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gems:#8b5cf6;--gems2:#a78bfa;--red:#ff5470}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
  html,body{background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}

  .stage{
    position:relative;width:96vmin;height:96vmin;
    background:radial-gradient(120% 100% at 65% 20%,#0e0b24 0%,#04050f 62%);
    overflow:hidden;box-shadow:0 40px 140px rgba(0,0,0,.8);
  }
  .grain{position:absolute;inset:0;opacity:.5;z-index:1;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);
    background-size:36px 36px}

  .field{position:absolute;inset:0;z-index:2}
  .orb{
    position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;opacity:0;transform:scale(.6);
    animation:pop .7s cubic-bezier(.2,1.3,.3,1) forwards;
  }
  @keyframes pop{to{opacity:1;transform:scale(1)}}
  .orb .ring{position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.14)}

  /* intento de conexión roto — una línea que no llega */
  .snap{position:absolute;z-index:3;opacity:.5}

  /* scrim — garantiza contraste del título sin importar qué orbe quede detrás */
  .scrim{position:absolute;left:0;right:0;bottom:0;height:60%;z-index:5;pointer-events:none;
    background:linear-gradient(to top,rgba(4,5,15,.88) 0%,rgba(4,5,15,.6) 42%,transparent 100%)}

  .copy{position:absolute;left:7%;bottom:8%;right:7%;z-index:10}
  .kicker{display:flex;align-items:center;gap:0.9vmin;font-size:1.5vmin;font-weight:800;letter-spacing:.28em;color:var(--gems2);text-transform:uppercase;margin-bottom:1.8vmin}
  .kicker img{width:2.8vmin;height:2.8vmin;object-fit:contain;filter:drop-shadow(0 0 6px rgba(139,92,246,.65))}
  .headline{font-size:7.4vmin;font-weight:900;line-height:1.02;letter-spacing:-.02em;color:#fff}
  .headline .hl{background:linear-gradient(120deg,var(--gems),var(--gems2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .headline .red{color:var(--red)}
  .sub{margin-top:2.2vmin;font-size:2.5vmin;font-weight:500;color:#9aa0b0;max-width:82%;line-height:1.4}
  .cta{
    display:inline-flex;align-items:center;gap:1vmin;margin-top:3.2vmin;
    padding:1.6vmin 3vmin;border-radius:100px;font-size:2vmin;font-weight:800;color:#fff;
    background:linear-gradient(120deg,var(--gems),var(--gems2));
    box-shadow:0 10px 34px rgba(139,92,246,.5);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="field" id="field"></div>
  <div class="scrim"></div>

  <div class="copy">
    <div class="kicker"><img src="public/gems-logo.png" alt="">Gems Hub</div>
    <div class="headline">Tu equipo crece.<br><span class="red">La conexión,</span> <span class="hl">no.</span></div>
    <div class="sub">Más personas, más ruido. Y nadie sabe qué está haciendo el otro.</div>
    <div class="cta">Corta el caos →</div>
  </div>
</div>

<script>
const field = document.getElementById('field');
// Cada orbe = una persona del equipo, flotando sola en el espacio, sin líneas
// que las conecten entre sí — deliberado. Distribuidas en la mitad superior
// derecha para no chocar con el bloque de texto.
const people = [
  {x:58,y:10,s:9.5,c:['#8b5cf6','#5b21b6'],i:'MP',depth:1},
  {x:74,y:8, s:6.5,c:['#a78bfa','#6d28d9'],i:'JS',depth:.7},
  {x:88,y:16,s:8,  c:['#c4b5fd','#7c3aed'],i:'LR',depth:.9},
  {x:66,y:24,s:5,  c:['#818cf8','#4338ca'],i:'AN',depth:.5},
  {x:82,y:30,s:10, c:['#a78bfa','#6d28d9'],i:'TG',depth:1},
  {x:52,y:26,s:6,  c:['#c4b5fd','#7c3aed'],i:'RM',depth:.6},
  {x:94,y:40,s:5.5,c:['#818cf8','#4338ca'],i:'KV',depth:.55},
  {x:63,y:38,s:4.5,c:['#8b5cf6','#5b21b6'],i:'EF',depth:.45},
  {x:76,y:44,s:7,  c:['#a78bfa','#6d28d9'],i:'DS',depth:.75},
];
people.forEach((p,i)=>{
  const el=document.createElement('div');
  el.className='orb';
  el.style.left=p.x+'%';el.style.top=p.y+'%';
  el.style.width=p.s+'vmin';el.style.height=p.s+'vmin';
  el.style.fontSize=(p.s*0.32)+'vmin';
  el.style.background=`radial-gradient(circle at 32% 28%, ${p.c[0]}, ${p.c[1]})`;
  el.style.boxShadow=`0 0 ${p.s*2.2}px rgba(139,92,246,${0.25+p.depth*0.35})`;
  el.style.filter=`blur(${(1-p.depth)*1.6}px)`;
  el.style.opacity=0.55+p.depth*0.45;
  el.style.animationDelay=(i*0.09)+'s';
  el.innerHTML=p.i+'<div class="ring"></div>';
  field.appendChild(el);
});

// una línea que intenta conectar dos orbes y se corta a la mitad — el único
// "casi vínculo" en toda la pieza, y ni siquiera llega.
const snap=document.createElementNS('http://www.w3.org/2000/svg','svg');
snap.setAttribute('class','snap');
snap.setAttribute('viewBox','0 0 100 100');
snap.setAttribute('preserveAspectRatio','none');
snap.style.left='50%';snap.style.top='6%';snap.style.width='42%';snap.style.height='32%';
snap.innerHTML='<path d="M4 10 C 20 20, 30 26, 42 34" fill="none" stroke="#ff5470" stroke-width="0.6" stroke-dasharray="2 3" stroke-linecap="round"/>';
field.appendChild(snap);
</script>
</body>
</html>
