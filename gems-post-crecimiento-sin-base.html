<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMS Hub — Creciste rápido, tu base no</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gems:#8b5cf6;--gems2:#a78bfa;--red:#ff5470}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
  html,body{background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}

  .stage{
    position:relative;width:96vmin;height:96vmin;
    background:radial-gradient(120% 100% at 75% 20%,#0e0b24 0%,#04050f 62%);
    overflow:hidden;box-shadow:0 40px 140px rgba(0,0,0,.8);
  }
  .grain{position:absolute;inset:0;opacity:.5;z-index:1;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);
    background-size:36px 36px}

  /* escalera de cristal ascendente, en perspectiva */
  .stairs{position:absolute;right:6%;bottom:30%;width:64%;height:52%;
    perspective:900px;z-index:2}
  .bar{
    position:absolute;bottom:0;border-radius:6px 6px 2px 2px;
    background:linear-gradient(180deg,rgba(255,255,255,.5),var(--gems2) 22%,var(--gems) 75%,#4c1d95 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 18px 40px -8px rgba(139,92,246,.55);
    transform:rotateX(28deg) rotateZ(-8deg);
    opacity:0;transform-origin:bottom center;
    animation:rise .8s cubic-bezier(.2,1,.3,1) forwards;
  }
  @keyframes rise{from{opacity:0;transform:rotateX(28deg) rotateZ(-8deg) scaleY(.2)}to{opacity:1;transform:rotateX(28deg) rotateZ(-8deg) scaleY(1)}}
  .bar .cap{position:absolute;top:-3px;left:0;right:0;height:6px;border-radius:6px;
    background:linear-gradient(90deg,#fff,var(--gems2));opacity:.9}

  /* base enredada — hilos de caos sosteniendo el crecimiento. Confinada bajo
     las barras más altas (x>72%), fuera del ancho máximo del texto (~65%),
     para que nunca lo toque sin importar cuánto ocupe el párrafo. */
  .roots{position:absolute;left:72%;right:0;bottom:0;height:40%;z-index:3;
    -webkit-mask-image:linear-gradient(to top,#000 40%,transparent 100%)}
  .roots svg{width:100%;height:100%}

  /* fractura entre base y crecimiento */
  .fault{position:absolute;left:0;right:0;bottom:33%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,84,112,.55) 30%,rgba(255,84,112,.55) 75%,transparent);
    z-index:4}

  .copy{position:absolute;left:7%;bottom:8%;right:7%;z-index:10}
  .kicker{display:flex;align-items:center;gap:0.9vmin;font-size:1.5vmin;font-weight:800;letter-spacing:.28em;color:var(--gems2);text-transform:uppercase;margin-bottom:1.8vmin}
  .kicker img{width:2.8vmin;height:2.8vmin;object-fit:contain;filter:drop-shadow(0 0 6px rgba(139,92,246,.65))}
  .headline{font-size:7.4vmin;font-weight:900;line-height:1.02;letter-spacing:-.02em;color:#fff}
  .headline .hl{background:linear-gradient(120deg,var(--gems),var(--gems2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .headline .red{color:var(--red)}
  .sub{margin-top:2.2vmin;font-size:2.5vmin;font-weight:500;color:#9aa0b0;max-width:82%;line-height:1.4}
  .cta{
    display:inline-flex;align-items:center;gap:1vmin;margin-top:3.2vmin;
    padding:1.6vmin 3vmin;border-radius:100px;font-size:2vmin;font-weight:800;color:#fff;
    background:linear-gradient(120deg,var(--gems),var(--gems2));
    box-shadow:0 10px 34px rgba(139,92,246,.5);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>

  <div class="roots">
    <svg viewBox="0 0 400 140" preserveAspectRatio="none">
      <g fill="none" stroke="#ff5470" stroke-width="1.4" stroke-linecap="round" opacity=".55">
        <path d="M20 10 C 60 40, 40 70, 90 90 S 140 60, 130 130"/>
        <path d="M70 5 C 90 50, 50 60, 100 100 S 60 120, 80 138"/>
        <path d="M140 15 C 170 45, 120 55, 160 95 S 210 70, 190 135"/>
        <path d="M210 8 C 190 45, 250 55, 220 95 S 260 115, 250 138"/>
        <path d="M270 12 C 300 45, 260 65, 300 95 S 330 70, 320 135"/>
        <path d="M330 6 C 350 40, 310 60, 350 92 S 390 80, 380 138"/>
        <path d="M10 40 C 40 60, 20 85, 55 110"/>
        <path d="M240 20 C 220 55, 270 70, 240 110"/>
      </g>
      <g fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity=".3">
        <path d="M0 30 C 40 55, 20 80, 70 100"/>
        <path d="M180 20 C 210 55, 170 65, 200 105"/>
        <path d="M300 25 C 330 55, 290 70, 330 108"/>
      </g>
    </svg>
  </div>

  <div class="fault"></div>

  <div class="stairs" id="stairs"></div>

  <div class="copy">
    <div class="kicker"><img src="public/gems-logo.png" alt="">Gems Hub</div>
    <div class="headline">Creciste rápido.<br><span class="red">Tu base</span> <span class="hl">no.</span></div>
    <div class="sub">Cada nuevo cliente sin un sistema detrás es una grieta más en la operación.</div>
    <div class="cta">Empieza gratis →</div>
  </div>
</div>

<script>
const stairs = document.getElementById('stairs');
const bars = [
  {h:22, x:2},  {h:34, x:16}, {h:30, x:30},
  {h:48, x:44}, {h:60, x:58}, {h:52, x:72}, {h:82, x:86},
];
bars.forEach((b,i)=>{
  const el=document.createElement('div');
  el.className='bar';
  el.style.left=b.x+'%';
  el.style.width='11%';
  el.style.height=b.h+'%';
  el.style.animationDelay=(i*0.12)+'s';
  const cap=document.createElement('div');cap.className='cap';
  el.appendChild(cap);
  stairs.appendChild(el);
});
</script>
</body>
</html>
